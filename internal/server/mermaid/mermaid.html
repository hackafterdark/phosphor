<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mermaid Diagram</title>
  <style>
    body {
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #1a1a2e;
      overflow: hidden;
      font-family: sans-serif;
      height: 100vh;
      width: 100vw;
    }
    #container {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: grab;
    }
    #diagram {
      transform-origin: center center;
      transition: transform 0.1s ease-out;
    }
    #controls {
      position: fixed;
      top: 10px;
      right: 10px;
      z-index: 10;
      display: flex;
      gap: 5px;
    }
    #controls button {
      background: #2a2a3e;
      color: #eee;
      border: 1px solid #444;
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      user-select: none;
    }
    #controls button:hover { background: #3a3a4e; }
    .mermaid { display: flex; justify-content: center; align-items: center; }
    .error-page {
      color: #eee;
      text-align: center;
      padding: 40px;
    }
    .error-page h1 { color: #ff6b6b; margin-bottom: 10px; }
  </style>
  <script>{{.MermaidJS}}</script>
</head>
<body>
  <div id="controls">
    <button id="zoom-in" title="Zoom In">+</button>
    <button id="zoom-out" title="Zoom Out">−</button>
    <button id="reset-zoom" title="Reset View">Reset</button>
    <button id="download-svg" title="Download SVG">Download SVG</button>
  </div>
  <div id="container">
    <div id="diagram">
      <pre class="mermaid">{{.Syntax}}</pre>
    </div>
  </div>
  <script>
    (async function() {
      let scale = 1, tx = 0, ty = 0;
      let isDragging = false;
      let startX, startY;

      function updateTransform() {
        const el = document.getElementById("diagram");
        if (el) {
          el.style.transform = "translate(" + tx + "px, " + ty + "px) scale(" + scale + ")";
        }
      }

      document.getElementById("zoom-in").addEventListener("click", function() {
        scale = Math.min(scale * 1.2, 10);
        updateTransform();
      });
      document.getElementById("zoom-out").addEventListener("click", function() {
        scale = Math.max(scale / 1.2, 0.1);
        updateTransform();
      });
      document.getElementById("reset-zoom").addEventListener("click", function() {
        scale = 1; tx = 0; ty = 0;
        updateTransform();
      });

      const container = document.getElementById("container");
      container.addEventListener("mousedown", function(e) {
        if (e.target.closest("#controls")) return;
        isDragging = true;
        startX = e.clientX - tx;
        startY = e.clientY - ty;
        container.style.cursor = "grabbing";
      });
      document.addEventListener("mousemove", function(e) {
        if (!isDragging) return;
        tx = e.clientX - startX;
        ty = e.clientY - startY;
        updateTransform();
      });
      document.addEventListener("mouseup", function() {
        if (isDragging) {
          isDragging = false;
          container.style.cursor = "grab";
        }
      });
      container.addEventListener("wheel", function(e) {
        e.preventDefault();
        const delta = e.deltaY < 0 ? 1.1 : 1 / 1.1;
        scale = Math.min(Math.max(scale * delta, 0.1), 10);
        updateTransform();
      }, { passive: false });

      document.getElementById("download-svg").addEventListener("click", function() {
        const svg = document.querySelector(".mermaid svg");
        if (!svg) { alert("Diagram not yet rendered."); return; }
        const blob = new Blob([svg.outerHTML], { type: "image/svg+xml" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "diagram.svg";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(a.href);
      });

      try {
        if (typeof mermaid !== "undefined") {
          mermaid.initialize({ startOnLoad: false, theme: "{{.Theme}}" });
          await mermaid.run({ nodes: document.querySelectorAll(".mermaid") });
        }
      } catch (err) {
        console.error("Failed to render Mermaid diagram:", err);
      }
    })();
  </script>
</body>
</html>
