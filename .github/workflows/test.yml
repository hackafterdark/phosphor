name: "test"

# CI test suite: runs the full Go test suite on every push to main and every
# pull request (plus manual dispatch). Covers Linux, macOS and Windows so the
# suite — notably the workspace pathguard / confinement tests — is exercised
# on all three hosts, not just one. Publishes nothing.
#
# The suite is sharded across 3 jobs per platform. Per-package test times are
# wildly skewed (internal/backend alone runs ~130s while the median package is
# under a second), so sharding cuts the wall-clock tail: each shard compiles
# and runs only its own package subset against the shared setup-go build cache.
#
# CGO is enabled on every platform (matching build.yml) so the tree-sitter
# structural_search backend compiles. Tests run natively on each runner: we do
# NOT pin GOOS/GOARCH (unlike build.yml), because `go test` must *execute* the
# binaries it builds and a host cannot exec a foreign-arch binary.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

env:
  # Match the local toolchain expectations from the Taskfile (see AGENTS.md).
  GOEXPERIMENT: greenteagc
  GOTOOLCHAIN: auto
  CGO_ENABLED: "1"

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Keep the shard count in sync with the Resolve shard packages step.
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        shard: [0, 1, 2]
    # Intentionally NOT setting GOOS/GOARCH: go test must run the binaries it
    # builds, so they must match the runner's native arch. Forcing them would
    # cross-compile and the runner would fail to exec them ("exec format error").
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: true

      # Windows runners ship no C compiler; cgo (tree-sitter) needs one. The
      # Chocolatey mingw package installs to C:/Tools/mingw64. Runner images
      # may already carry MinGW, so only install when gcc is genuinely absent.
      - name: Install MinGW (Windows cgo toolchain)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          if [ ! -x "C:/Tools/mingw64/bin/gcc.exe" ]; then
            choco install mingw --no-progress -y
          fi

      - name: Resolve shard packages
        id: pkgs
        shell: bash
        run: |
          go list ./... | awk -v shard="${{ matrix.shard }}" 'NR % 3 == shard' > shard-packages.txt
          echo "count=$(wc -l < shard-packages.txt)" >> "$GITHUB_OUTPUT"
          if [ -s shard-packages.txt ]; then
            echo "nonempty=true" >> "$GITHUB_OUTPUT"
          else
            echo "nonempty=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run tests
        if: steps.pkgs.outputs.nonempty == 'true'
        shell: bash
        run: |
          # Windows cgo needs the MinGW compiler; other runners use the
          # platform default (gcc / clang).
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            export CGO_CC="C:/Tools/mingw64/bin/gcc.exe"
          fi
          go test -count=1 -timeout=30m $(cat shard-packages.txt)