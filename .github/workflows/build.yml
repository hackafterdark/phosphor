name: "build"

# CI build for every commit on main and every pull request. Compiles and
# packages the CGO (tree-sitter) enabled binaries for the shipped platforms so
# a build break is caught on main/PR before it is ever cut as a release tag.
# Publishes nothing; artifacts land on the workflow run for inspection.
#
# linux/arm64 is the one target built with CGO_ENABLED=0 (see the matrix note).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

env:
  # Match the local toolchain expectations from the Taskfile. CGO_ENABLED is set
  # per matrix entry below (linux/arm64 ships without it).
  GOEXPERIMENT: greenteagc
  GOTOOLCHAIN: auto

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native build per platform so cgo/tree-sitter links against that
          # platform's own toolchain. linux/arm64 ships with cgo OFF
          # (CGO_ENABLED=0): cross-compiling tree-sitter's C for arm64 from the
          # amd64 runner is unreliable, so that one target loses structural_search
          # (falls back to grep) to stay buildable on stock hosted runners. Flip
          # its cgo to "1" once you enable native ARM64 hosted runners. The linux/arm64
          # artifact carries a "-lite" suffix so users can tell it lacks the cgo
          # (tree-sitter / structural-search) features.
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
            cc: gcc
            cgo: "1"
            ext: ""
            suffix: ""
          - runner: ubuntu-latest
            goos: linux
            goarch: arm64
            cc: ""
            cgo: "0"
            ext: ""
            suffix: "-lite"
          - runner: macos-latest
            goos: darwin
            goarch: arm64
            cc: cc
            cgo: "1"
            ext: ""
            suffix: ""
          - runner: windows-latest
            goos: windows
            goarch: amd64
            cc: C:/Tools/mingw64/bin/gcc.exe
            cgo: "1"
            ext: ".exe"
            suffix: ""
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: ${{ matrix.cgo }}
      CGO_CC: ${{ matrix.cc }}
      BIN: phosphor-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }}${{ matrix.ext }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: true

      # Windows runners ship no C compiler; cgo (tree-sitter) needs one. The
      # Chocolatey mingw package installs to C:/Tools/mingw64, which the CGO_CC
      # matrix value above points at.
      - name: Install MinGW (Windows cgo toolchain)
        if: matrix.goos == 'windows'
        run: choco install mingw --no-progress -y

      - name: Build
        run: |
          mkdir -p dist
          SHORT="${GITHUB_SHA:0:7}"
          go build -v -o "dist/${BIN}" -ldflags "-X github.com/hackafterdark/phosphor/internal/version.Version=${SHORT} -X github.com/hackafterdark/phosphor/pkg/phosphordocs.Version=${SHORT} -X github.com/hackafterdark/phosphor/internal/version.Commit=${GITHUB_SHA}" .
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phosphor-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }}
          path: dist
          if-no-match-files: warn
          retention-days: 7
